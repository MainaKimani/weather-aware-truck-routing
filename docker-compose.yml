# Local stack: api + postgres + redis + web. Production deploy is SPOT-100/101.
services:
  api:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    command: sh -c "uv sync --frozen && uv run python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,api"
      DATABASE_URL: postgres://spotter:spotter@postgres:5432/spotter
      REDIS_URL: redis://redis:6379/0
      UV_PROJECT_ENVIRONMENT: /venv
    volumes:
      - ./backend:/app
      - api-venv:/venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spotter
      POSTGRES_PASSWORD: spotter
      POSTGRES_DB: spotter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotter"]
      interval: 2s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
  api-venv:
  web-node-modules:
