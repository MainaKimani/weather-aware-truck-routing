[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "django>=5.2,<6",
    "django-allauth>=65.19.4",
    "django-environ>=0.14.0",
    "django-redis>=7.0.0",
    "django-stubs-ext>=6.1.2",
    "djangorestframework>=3.18.3",
    "drf-spectacular>=0.28",
    "flexpolyline>=0.1.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "hypothesis>=6.169.0",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# DTZ: no naive datetimes (ETAs and forecast hours are all tz-aware).
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things; fixed passwords in tests are fixtures,
# not secrets.
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
# Strict everywhere. (A per-module strict override turned out to apply
# project-wide anyway, so say so plainly.)
strict = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "flexpolyline.*", "django_redis.*", "allauth.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.coverage.run]
source = ["planner", "accounts", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
