[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
