[project]
name = "spotter-backend"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# DTZ: no naive datetimes (ETAs and forecast hours are all tz-aware).
select = ["E", "W", "F", "I", "B", "UP", "S", "DTZ", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks things.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["/migrations/"]

# The domain and provider layers are pure, typed Python: hold them to strict.
[[tool.mypy.overrides]]
module = ["planner.domain.*", "planner.providers.*"]
strict = true

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.coverage.run]
source = ["planner", "accounts", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
