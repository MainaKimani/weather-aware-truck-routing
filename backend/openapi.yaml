openapi: 3.0.3
info:
  title: Weather-Aware Truck Routing API
  version: 1.0.0
  description: Plans truck routes rated for weather risk along the way.
paths:
  /api/v1/geocode/suggest:
    get:
      operationId: suggest_places
      description: Places matching a partial query, for the origin and destination
        fields.
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Partial place name; under 3 characters gives [].
        required: true
      tags:
      - geocode
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_input: q missing or over 100 characters'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: geocoding_unavailable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'quota_reached: place search has used this month''s allowance'
  /api/v1/me:
    get:
      operationId: get_me
      description: |-
        Who the caller is: a signed-in user, a guest who has planned, or neither.

        The app asks this first, so the response also sets the CSRF cookie that
        every later sign-up, login or plan sends back as `X-CSRFToken`.
      tags:
      - me
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: delete_me
      description: |-
        Delete the account and everything in it, then end the session.

        Needs the password, so a session left open on a shared computer can't
        be used to delete someone's account. The user's trips, their routes
        and heatmaps, and allauth's email records all go with the user.
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_input: wrong password'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: not_authenticated
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/plans:
    post:
      operationId: create_plan
      description: |-
        Plan a trip: three routes rated for weather risk, and a recommendation.

        The plan is saved as a trip owned by the caller (a new guest on their
        first plan) and the saved snapshot is returned. A repeat with the same
        `Idempotency-Key` returns the trip that key created instead of planning
        again.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUID per form submission; a repeat returns the same trip.
      tags:
      - plans
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlanRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PlanRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Plan'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_input: a field is missing or out of range'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'idempotency_conflict: the key belongs to another caller''s
            trip'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'no_route: no truck route between the places'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: routing_unavailable or weather_unavailable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'quota_reached: live routing has used this month''s allowance'
  /api/v1/trips:
    get:
      operationId: list_trips
      description: |-
        The caller's trips, newest first.

        Signed-in users page through all of theirs with the cursor in `next`.
        A guest gets their latest 20 and no further pages. A visitor who hasn't
        planned yet gets an empty list.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
        description: From a previous page's `next`.
      - in: query
        name: q
        schema:
          type: string
          default: ''
          maxLength: 100
        description: Matches the name, origin or destination.
      - in: query
        name: saved
        schema:
          type: boolean
          nullable: true
        description: Only saved trips, or only not.
      tags:
      - trips
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_input
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/trips/{trip_id}:
    get:
      operationId: get_trip
      description: 'A saved trip: the plan as it was made, for its owner or, if shared,
        anyone.'
      parameters:
      - in: path
        name: trip_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: no such trip, or not yours and not shared'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
    patch:
      operationId: update_trip
      description: 'A saved trip: the plan as it was made, for its owner or, if shared,
        anyone.'
      parameters:
      - in: path
        name: trip_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTripUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedTripUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedTripUpdateRequest'
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: invalid_input
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'account_required: only signed-in users save trips'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: no such trip, or not yours (sharing doesn''t let
            others edit)'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
    delete:
      operationId: delete_trip
      description: 'A saved trip: the plan as it was made, for its owner or, if shared,
        anyone.'
      parameters:
      - in: path
        name: trip_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: no such trip, or not yours'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
  /api/v1/trips/{trip_id}/heatmap:
    get:
      operationId: trip_heatmap
      description: |-
        The trip's corridor heatmap: risk around its routes for each of the next 48 hours.

        Computed from the saved routes and load on the first request, then kept,
        so a reopened trip shows the heatmap as it was. Visible to whoever can see
        the trip.
      parameters:
      - in: query
        name: include
        schema:
          enum:
          - metrics
          type: string
          minLength: 1
        description: |-
          `metrics` adds each condition's levels, for the map's metric switcher.

          * `metrics` - metrics
      - in: path
        name: trip_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Heatmap'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: no such trip, or not yours and not shared'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: weather_unavailable
  /api/v1/trips/{trip_id}/replan:
    post:
      operationId: replan_trip
      description: |-
        Plan the trip again with current weather: the same places, load, interval
        and HOS clocks, leaving now if the original departure has passed.

        The new trip belongs to the caller, so anyone who can open a shared trip
        can re-plan it into their own. It records which trip it came from.
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: A UUID per click; a repeat returns the same new trip.
      - in: path
        name: trip_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - trips
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'invalid_input: the trip''s inputs no longer make a valid plan'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'not_found: no such trip, or not yours and not shared'
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'idempotency_conflict: the key belongs to another caller''s
            trip'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'no_route: no truck route between the places'
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: rate_limited
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: routing_unavailable or weather_unavailable
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: 'quota_reached: live routing has used this month''s allowance'
components:
  schemas:
    Checkpoint:
      type: object
      properties:
        mile:
          type: number
          format: double
        owned_mi:
          type: number
          format: double
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        eta:
          type: string
          format: date-time
        forecast:
          allOf:
          - $ref: '#/components/schemas/Forecast'
          nullable: true
        risk:
          $ref: '#/components/schemas/Risk'
      required:
      - eta
      - forecast
      - lat
      - lon
      - mile
      - owned_mi
      - risk
    Corridor:
      type: object
      properties:
        bbox:
          type: array
          items:
            type: number
            format: double
          readOnly: true
          description: '[west, south, east, north] of all routes.'
      required:
      - bbox
    CycleEnum:
      enum:
      - 70h_8d
      - 60h_7d
      type: string
      description: |-
        * `70h_8d` - 70h_8d
        * `60h_7d` - 60h_7d
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Stable machine-readable code, e.g. invalid_input.
        message:
          type: string
          description: A sentence for the user.
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: 'Validation messages by field, nested fields dotted: {"hos.drive_left_h":
            [...]}'
      required:
      - code
      - message
    Forecast:
      type: object
      properties:
        valid_hour:
          type: string
          format: date-time
        wind_mph:
          type: number
          format: double
          nullable: true
        gust_mph:
          type: number
          format: double
          nullable: true
        rain_in_hr:
          type: number
          format: double
          nullable: true
        snow_in_hr:
          type: number
          format: double
          nullable: true
        weather_code:
          type: integer
          nullable: true
      required:
      - gust_mph
      - rain_in_hr
      - snow_in_hr
      - valid_hour
      - weather_code
      - wind_mph
    Heatmap:
      type: object
      description: |-
        The corridor grid (RFC §7.3).

        `risk[i][h]` is point i's level (0-4) at hour h; null is Unknown.
      properties:
        start_hour:
          type: string
          format: date-time
          description: The forecast hour shown at slider hour 0.
        hours:
          type: integer
        cell_deg:
          type: number
          format: double
        stale:
          type: boolean
        forecast_as_of:
          type: string
          format: date-time
          nullable: true
        points:
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          readOnly: true
          description: '[lon, lat] per grid point.'
        risk:
          type: array
          items:
            type: array
            items:
              type: integer
              nullable: true
          readOnly: true
        metrics:
          allOf:
          - $ref: '#/components/schemas/HeatmapMetrics'
          nullable: true
          description: Only with `?include=metrics`. Null for a heatmap kept before
            conditions were.
      required:
      - cell_deg
      - forecast_as_of
      - hours
      - points
      - risk
      - stale
      - start_hour
    HeatmapMetrics:
      type: object
      description: |-
        Each condition's level (0-4; null for no data), indexed like `risk`.

        The levels a checkpoint's rating shows for each condition, so whichever
        one the map shows, it agrees with the checkpoint table.
      properties:
        wind:
          type: array
          items:
            type: array
            items:
              type: integer
              nullable: true
          readOnly: true
          description: Gusts, after the trip's load rules.
        rain:
          type: array
          items:
            type: array
            items:
              type: integer
              nullable: true
          readOnly: true
        snow:
          type: array
          items:
            type: array
            items:
              type: integer
              nullable: true
          readOnly: true
      required:
      - rain
      - snow
      - wind
    Hos:
      type: object
      properties:
        enabled:
          type: boolean
          readOnly: true
        cycle:
          allOf:
          - $ref: '#/components/schemas/CycleEnum'
          readOnly: true
        drive_left_h:
          type: number
          format: double
          readOnly: true
        window_left_h:
          type: number
          format: double
          readOnly: true
        until_break_h:
          type: number
          format: double
          readOnly: true
        cycle_left_h:
          type: number
          format: double
          readOnly: true
      required:
      - cycle
      - cycle_left_h
      - drive_left_h
      - enabled
      - until_break_h
      - window_left_h
    HosRequest:
      type: object
      description: The driver's ELD clocks, in hours remaining (PRD §7.3.1).
      properties:
        enabled:
          type: boolean
          default: false
        cycle:
          $ref: '#/components/schemas/CycleEnum'
        drive_left_h:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        window_left_h:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        until_break_h:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        cycle_left_h:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
    HosStop:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/HosStopKindEnum'
        reason:
          $ref: '#/components/schemas/HosStopReasonEnum'
        mile:
          type: number
          format: double
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        start:
          type: string
          format: date-time
        duration_s:
          type: integer
      required:
      - duration_s
      - kind
      - lat
      - lon
      - mile
      - reason
      - start
    HosStopKindEnum:
      type: string
      enum:
      - break
      - rest
      - restart
    HosStopReasonEnum:
      enum:
      - break
      - drive_limit
      - window
      - cycle
      type: string
      description: |-
        * `break` - break
        * `drive_limit` - drive_limit
        * `window` - window
        * `cycle` - cycle
    Inputs:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/Place'
        destination:
          $ref: '#/components/schemas/Place'
        departure:
          type: string
          format: date-time
        load_lb:
          type: integer
        interval_mi:
          type: integer
        hos:
          allOf:
          - $ref: '#/components/schemas/Hos'
          nullable: true
      required:
      - departure
      - destination
      - hos
      - interval_mi
      - load_lb
      - origin
    IntervalMiEnum:
      enum:
      - 10
      - 25
      - 50
      type: integer
      description: |-
        * `10` - 10
        * `25` - 25
        * `50` - 50
    LoadRuleEnum:
      enum:
      - wind_45_54_over_30k
      - wind_35_44_over_40k
      type: string
      description: |-
        * `wind_45_54_over_30k` - wind_45_54_over_30k
        * `wind_35_44_over_40k` - wind_35_44_over_40k
    Me:
      type: object
      description: Who the caller is, for the header.
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/MeUser'
          nullable: true
          description: The signed-in user, or null.
        guest:
          type: boolean
          description: A guest who has planned on this device.
        recent_trip_count:
          type: integer
          description: 'Trips the caller owns: a guest''s on this device, or a user''s
            in total.'
      required:
      - guest
      - recent_trip_count
      - user
    MeUser:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Metrics:
      type: object
      properties:
        miles_by_level:
          $ref: '#/components/schemas/MilesByLevel'
        avg_risk:
          type: number
          format: double
          nullable: true
        worst:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          nullable: true
        worst_at_mile:
          type: number
          format: double
          nullable: true
        drivable:
          type: boolean
      required:
      - avg_risk
      - drivable
      - miles_by_level
      - worst
      - worst_at_mile
    MilesByLevel:
      type: object
      properties:
        LOW:
          type: number
          format: double
        MODERATE:
          type: number
          format: double
        HIGH:
          type: number
          format: double
        SEVERE:
          type: number
          format: double
        NO_TRAVEL:
          type: number
          format: double
        UNKNOWN:
          type: number
          format: double
      required:
      - HIGH
      - LOW
      - MODERATE
      - NO_TRAVEL
      - SEVERE
      - UNKNOWN
    NullEnum:
      enum:
      - null
    PatchedTripUpdateRequest:
      type: object
      description: What the owner can change; send only the fields to change.
      properties:
        name:
          type: string
          maxLength: 120
        saved:
          type: boolean
          description: Signed-in users only.
        shared:
          type: boolean
          description: Anyone with the link can open it, read-only.
    Place:
      type: object
      properties:
        label:
          type: string
        lat:
          type: number
          format: double
        lon:
          type: number
          format: double
        tz:
          type: string
          nullable: true
      required:
      - label
      - lat
      - lon
      - tz
    PlaceRequest:
      type: object
      properties:
        lat:
          type: number
          format: double
          maximum: 90
          minimum: -90
        lon:
          type: number
          format: double
          maximum: 180
          minimum: -180
        label:
          type: string
          minLength: 1
          maxLength: 200
        tz:
          type: string
          nullable: true
          minLength: 1
          maxLength: 64
      required:
      - label
      - lat
      - lon
    Plan:
      type: object
      description: 'A planned trip, as saved: what was asked, the ranked routes and
        the recommendation.'
      properties:
        generated_at:
          type: string
          format: date-time
        rules_version:
          type: string
        stale:
          type: boolean
        forecast_as_of:
          type: string
          format: date-time
          nullable: true
        demo:
          type: boolean
        inputs:
          $ref: '#/components/schemas/Inputs'
        settings:
          $ref: '#/components/schemas/Settings'
        recommended_route_id:
          type: string
          nullable: true
        reason_code:
          $ref: '#/components/schemas/ReasonCodeEnum'
        recommendation_reason:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        corridor:
          $ref: '#/components/schemas/Corridor'
        trip_id:
          type: string
          format: uuid
          description: The saved trip; its heatmap is under /trips/{id}.
      required:
      - corridor
      - demo
      - forecast_as_of
      - generated_at
      - inputs
      - reason_code
      - recommendation_reason
      - recommended_route_id
      - routes
      - rules_version
      - settings
      - stale
      - trip_id
      - warnings
    PlanRequest:
      type: object
      properties:
        origin:
          $ref: '#/components/schemas/PlaceRequest'
        destination:
          $ref: '#/components/schemas/PlaceRequest'
        departure:
          type: string
          format: date-time
        load_lb:
          type: integer
          maximum: 80000
          minimum: 1
        interval_mi:
          $ref: '#/components/schemas/IntervalMiEnum'
        hos:
          $ref: '#/components/schemas/HosRequest'
      required:
      - departure
      - destination
      - interval_mi
      - load_lb
      - origin
    ReasonCodeEnum:
      enum:
      - no_travel
      - severe
      - high
      - avg_risk
      - duration
      - tie
      - only_route
      - no_drivable_route
      type: string
      description: |-
        * `no_travel` - no_travel
        * `severe` - severe
        * `high` - high
        * `avg_risk` - avg_risk
        * `duration` - duration
        * `tie` - tie
        * `only_route` - only_route
        * `no_drivable_route` - no_drivable_route
    Risk:
      type: object
      properties:
        level:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          nullable: true
        driver:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RiskDriverEnum'
          - $ref: '#/components/schemas/NullEnum'
        wind:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          nullable: true
        wind_adjusted:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          nullable: true
        rain:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          nullable: true
        snow:
          allOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          nullable: true
        load_rule:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/LoadRuleEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - driver
      - level
      - load_rule
      - rain
      - snow
      - wind
      - wind_adjusted
    RiskDriverEnum:
      enum:
      - wind
      - rain
      - snow
      type: string
      description: |-
        * `wind` - wind
        * `rain` - rain
        * `snow` - snow
    RiskLevelEnum:
      type: string
      enum:
      - LOW
      - MODERATE
      - HIGH
      - SEVERE
      - NO_TRAVEL
    Route:
      type: object
      properties:
        id:
          type: string
        rank:
          type: integer
        name:
          type: string
        label:
          type: string
          nullable: true
        geometry:
          type: string
          readOnly: true
          description: Encoded polyline, precision 5.
        distance_mi:
          type: number
          format: double
        duration_s:
          type: integer
          description: Driving time only.
        trip_duration_s:
          type: integer
          description: Driving plus Hours of Service stops.
        departure:
          type: string
          format: date-time
        arrival:
          type: string
          format: date-time
        eta_estimated:
          type: boolean
        hos_stops:
          type: array
          items:
            $ref: '#/components/schemas/HosStop'
        metrics:
          $ref: '#/components/schemas/Metrics'
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/Checkpoint'
      required:
      - arrival
      - checkpoints
      - departure
      - distance_mi
      - duration_s
      - eta_estimated
      - geometry
      - hos_stops
      - id
      - label
      - metrics
      - name
      - rank
      - trip_duration_s
    Settings:
      type: object
      properties:
        wind_basis:
          type: string
          readOnly: true
        avg_risk_tolerance:
          type: number
          format: double
          readOnly: true
        hos_enabled:
          type: boolean
          readOnly: true
      required:
      - avg_risk_tolerance
      - hos_enabled
      - wind_basis
    Trip:
      type: object
      description: 'A saved trip: its plan response, what the owner has set, and who
        is asking.'
      properties:
        generated_at:
          type: string
          format: date-time
        rules_version:
          type: string
        stale:
          type: boolean
        forecast_as_of:
          type: string
          format: date-time
          nullable: true
        demo:
          type: boolean
        inputs:
          $ref: '#/components/schemas/Inputs'
        settings:
          $ref: '#/components/schemas/Settings'
        recommended_route_id:
          type: string
          nullable: true
        reason_code:
          $ref: '#/components/schemas/ReasonCodeEnum'
        recommendation_reason:
          type: string
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
        corridor:
          $ref: '#/components/schemas/Corridor'
        trip_id:
          type: string
          format: uuid
          description: The saved trip; its heatmap is under /trips/{id}.
        name:
          type: string
        saved:
          type: boolean
        shared:
          type: boolean
        created_at:
          type: string
          format: date-time
        is_owner:
          type: boolean
          description: Whether the caller may change the trip.
        replanned_from:
          type: string
          format: uuid
          nullable: true
          description: The trip this one re-planned, if any.
      required:
      - corridor
      - created_at
      - demo
      - forecast_as_of
      - generated_at
      - inputs
      - is_owner
      - name
      - reason_code
      - recommendation_reason
      - recommended_route_id
      - replanned_from
      - routes
      - rules_version
      - saved
      - settings
      - shared
      - stale
      - trip_id
      - warnings
    TripPage:
      type: object
      description: A page of trips, newest first. Follow `next` for the one after;
        guests get one page.
      properties:
        next:
          type: string
          format: uri
          nullable: true
        previous:
          type: string
          format: uri
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/TripSummary'
      required:
      - next
      - previous
      - results
    TripRouteSummary:
      type: object
      description: The recommended route, as a trip list shows it.
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
          nullable: true
        worst:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RiskLevelEnum'
          - $ref: '#/components/schemas/NullEnum'
        drivable:
          type: boolean
      required:
      - drivable
      - id
      - label
      - name
      - worst
    TripSummary:
      type: object
      description: 'One trip in a list: enough to recognise it, without its routes''
        detail.'
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        name:
          type: string
          description: Set by the owner; empty until then.
        saved:
          type: boolean
        shared:
          type: boolean
        origin:
          type: string
        destination:
          type: string
        departure:
          type: string
          format: date-time
        load_lb:
          type: integer
        interval_mi:
          type: integer
        demo:
          type: boolean
        stale:
          type: boolean
        recommended:
          allOf:
          - $ref: '#/components/schemas/TripRouteSummary'
          nullable: true
          readOnly: true
          description: Null when no route is drivable, so none is recommended.
      required:
      - created_at
      - demo
      - departure
      - destination
      - id
      - interval_mi
      - load_lb
      - name
      - origin
      - recommended
      - saved
      - shared
      - stale
    Warning:
      type: object
      properties:
        code:
          $ref: '#/components/schemas/WarningCodeEnum'
        message:
          type: string
        route_id:
          type: string
          nullable: true
      required:
      - code
      - message
      - route_id
    WarningCodeEnum:
      enum:
      - only_n_routes_found
      - high_unknown
      - partial_forecast
      - eta_estimated
      type: string
      description: |-
        * `only_n_routes_found` - only_n_routes_found
        * `high_unknown` - high_unknown
        * `partial_forecast` - partial_forecast
        * `eta_estimated` - eta_estimated
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
