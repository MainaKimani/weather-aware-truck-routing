# Frontend gates. Called from ci.yml when frontend files change; not run directly.
name: Frontend

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: API types match backend/openapi.yaml
        run: npm run gen:api:check
      - name: eslint
        run: npm run lint
      - name: prettier
        run: npm run format:check
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: npm audit
        run: npm audit --audit-level=high
