name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spotter
          POSTGRES_PASSWORD: spotter
          POSTGRES_DB: spotter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spotter"
          --health-interval 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://spotter:spotter@localhost:5432/spotter
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: Migrations up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: pytest
        run: uv run pytest --cov --cov-report=term
      - name: Domain coverage ≥ 95%
        run: uv run coverage report --include='planner/domain/*' --fail-under=95

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: prettier
        run: npm run format:check
      - name: tsc
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - name: pip-audit
        working-directory: backend
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: npm audit
        working-directory: frontend
        run: npm audit --audit-level=high

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Conventional Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            python3 scripts/check_commit_msg.py "$RUNNER_TEMP/msg" || status=1
          done
          exit $status
