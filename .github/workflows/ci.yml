# Single entry point for CI. Branch protection should require only the
# `ci-ok` check: it always runs, so a side that was skipped because nothing
# changed there never leaves a required check pending.
name: CI

on:
  push:
    branches: [main, dev-backend, dev-frontend]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # main takes merges only from the dev branches; feature branches
          # go into a dev branch. See docs/tasks.md "How to use this file".
          case "$BASE" in
            main)
              case "$HEAD" in
                dev-backend|dev-frontend) ;;
                *) echo "::error::main only accepts PRs from dev-backend or dev-frontend, not '$HEAD'."; exit 1 ;;
              esac ;;
            dev-backend|dev-frontend) ;;
            *) echo "::error::PRs must target main, dev-backend or dev-frontend, not '$BASE'."; exit 1 ;;
          esac
          echo "OK: $HEAD -> $BASE"

  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE...HEAD"
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]] \
               && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..HEAD"
          else
            range=""  # new branch or unknown base: run everything
          fi

          if [ -z "$range" ]; then
            backend=true; frontend=true
          else
            files=$(git diff --name-only "$range")
            echo "Changed files ($range):"; echo "$files"
            # Shared files (CI, Makefile, compose, hooks) affect both sides.
            shared='^(\.github/|Makefile$|docker-compose\.yml$|\.pre-commit-config\.yaml$|scripts/)'
            backend=false; frontend=false
            grep -Eq "^backend/|$shared" <<< "$files" && backend=true
            # The frontend's API types are generated from the backend's schema.
            grep -Eq "^frontend/|^backend/openapi\.yaml$|$shared" <<< "$files" && frontend=true
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend.yml

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/frontend.yml

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check every commit in the PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            python3 scripts/check_commit_msg.py "$RUNNER_TEMP/msg" || status=1
          done
          exit $status

  ci-ok:
    name: ci-ok
    if: always()
    needs: [branch-policy, changes, backend, frontend, commits]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job ended with '$r'."; exit 1 ;;
            esac
          done
